<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#0a0e1a">
    <meta name="description" content="J.A.R.V.I.S — Entry">
    <title>J.A.R.V.I.S // ENTRY</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/landing.css">
    <link rel="manifest" href="/manifest.json">
    <link rel="icon" type="image/svg+xml" href="/icons/icon.svg">
    <link rel="apple-touch-icon" href="/icons/icon.svg">
</head>
<body class="landing-page">

    <div class="bg-grid" aria-hidden="true"></div>

    <canvas id="brain-canvas" aria-hidden="true"></canvas>

    <div class="hud-corners" aria-hidden="true">
        <span class="corner tl"></span>
        <span class="corner tr"></span>
        <span class="corner bl"></span>
        <span class="corner br"></span>
    </div>

    <div class="landing-ui">

        <header class="landing-header">
            <div class="brand">
                <span class="brand-icon">◉</span>
                <h1>J.A.R.V.I.S</h1>
            </div>
            <p class="subtitle">NEURAL KERNEL V6.0</p>
        </header>

        <div class="landing-controls">
            <form id="landing-form" class="landing-form" autocomplete="off">
                <input
                    type="text"
                    id="landing-input"
                    class="landing-input"
                    placeholder="שאל אותי משהו..."
                    autocomplete="off"
                    maxlength="500"
                    autofocus
                >
                <button type="submit" id="landing-send" class="landing-send" aria-label="שלח">
                    <span>↑</span>
                </button>
            </form>

            <button type="button" id="enter-btn" class="enter-btn">
                <span class="enter-icon">◈</span>
                <span class="enter-text">כניסה למערכת</span>
                <span class="enter-arrow">←</span>
            </button>
        </div>

        <footer class="landing-footer">
            <span class="footer-tag">BIT NEURAL LINK-256</span>
            <span class="footer-dot">•</span>
            <span class="footer-tag">SECURE PROTOCOL</span>
        </footer>

    </div>

    <script src="/js/landing.js" defer></script>
</body>
</html>
